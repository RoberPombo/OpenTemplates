name: PR Checks

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PR-Checks:
    name: PR Checks
    # No fork guard: on `pull_request`, `github.event.repository` describes the
    # base repo, so a guard there filters nothing. Fork PRs need maintainer
    # approval from GitHub and then run this job with a read-only token, no
    # secrets and SHA-pinned actions. Do not gate it on the head repo either.
    # Fijar runner: `ubuntu-latest` migró a 26.04 donde no están
    # libwebkit2gtk-4.1-dev/libappindicator3-dev/librsvg2-dev. 24.04 los trae.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture layers
        run: pnpm run check:layers

      - name: Typecheck, lint, format and tests
        run: pnpm run check

      - name: Build frontend
        run: pnpm run build

      - name: Check frontend bundle budget
        run: pnpm run check:bundle

      - name: Rust tests
        working-directory: src-tauri
        # Sin --locked: release-please sube la versión del crate en Cargo.toml y
        # el lock solo se actualiza al compilar; con --locked el PR de release
        # no puede pasar CI.
        run: cargo test

      - name: Build Tauri app
        run: pnpm run tauri build --no-bundle
