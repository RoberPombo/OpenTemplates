version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    # Never open a PR for a version published less than 7 days ago, so a
    # compromised or immediately yanked release does not reach the repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri-crate:
        patterns:
          - "tauri*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      # Todos los pasos de github/codeql-action deben usar la misma versión:
      # si se actualizan por separado, CodeQL falla con "configuration error".
      codeql-action:
        patterns:
          - "github/codeql-action*"
